[package]
name = "apx-feature-toggle-pro"
version = "2.0.0"
edition = "2021"
description = "GUI tool to manage Windows FeatureManagement hidden features"
license = "MIT"

[dependencies]
eframe = "0.27"
egui = "0.27"
winreg = "0.52"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
chrono = "0.4"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
lto = true
strip = true
