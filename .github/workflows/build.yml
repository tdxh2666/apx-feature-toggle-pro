name: Build APX Feature Toggle Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  APP_NAME: APXFeatureTogglePro

jobs:
  build-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Show Rust version
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Build release binary
        shell: pwsh
        run: cargo build --release

      - name: Package artifact
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $zipName = "${env:APP_NAME}-v$version-win64.zip"

          New-Item -ItemType Directory -Force -Path package | Out-Null

          Copy-Item target/release/apx-feature-toggle-pro.exe package/APXFeatureTogglePro.exe

          $readme = @"
          ================================================
          APX Feature Toggle Pro v$version
          Architecture: x64
          Built by GitHub Actions
          ================================================

          使用方法:
          1. 解压 zip
          2. 双击运行 APXFeatureTogglePro.exe
          3. 系统会自动弹出 UAC 管理员授权窗口
          4. 在界面中勾选 Feature ID，然后点击启用/禁用

          注意:
          - 本工具会修改 HKLM 注册表
          - 修改前会自动备份到程序目录下的 backups 文件夹
          - 启用功能后通常需要重启电脑
          - 当前多数消费级 CPU 不支持 APX，启用后不一定有实际性能变化
          "@

          $readme | Out-File package/使用说明.txt -Encoding utf8

          Compress-Archive -Path package/* -DestinationPath $zipName -Force

          "ARTIFACT_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: APXFeatureTogglePro-win64
          path: ${{ env.ARTIFACT_NAME }}
          retention-days: 90
